async function fetchBuf(url){
  if(bufCache[url])return bufCache[url];
  const targetUrls = [url, url.replace(/^http:/,'https:')];
  for(let i = 0; i < targetUrls.length; i++){
    const u = targetUrls[i];
    try{
      const r = await fetch(u);
      if(!r.ok) continue;
      const b = await ctx.decodeAudioData(await r.arrayBuffer());
      return bufCache[url]=b;
    }catch(e){}
  }
  return null; 
}

}

  const bar=s>>4,st=s&15,ch=bar%4,pr=PROG[ch];

  if(lvl===0){if(st%4===0)tone(mf(pr[(st>>2)%3]+12),t,.4,'sine',.08,musicBus,undefined,true);return;}

  if(st===4||st===12){noise(t,.18,.28,1800);tone(190,t,.12,'triangle',.18);}

}

    else musicStep(step%32,t);

}

for(let i=0;i<160;i++){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));m.visible=false;S.add(m);parts.push({m:m,v:new THREE.Vector3(),l:0});}
let pi=0;
function burst(p,col,n){const w=waves[wi++%waves.length];w.position.copy(p);w.material.color.setHex(col);w.userData.l=.35;w.visible=true;for(let i=0;i<n;i++){const q=parts[pi++%parts.length];q.m.position.copy(p);q.m.material.color.setHex(col);q.m.visible=true;q.l=.6+Math.random()*.3;q.v.set((Math.random()-.5)*4,(Math.random()-.3)*4,(Math.random()-.2)*3);}}

const hc=document.createElement('canvas');hc.width=1024;hc.height=512;
const hx=hc.getContext('2d'),hudTex=new THREE.CanvasTexture(hc);
const hud=new THREE.Mesh(new THREE.PlaneGeometry(4.4,2.2),new THREE.MeshBasicMaterial({map:hudTex,transparent:true,fog:false,depthWrite:false}));
hud.position.set(0,4,-6);S.add(hud);
const mult=function(){return Math.min(8,1+(combo/8|0));};

function drawHUD(){
  const g=hx;g.clearRect(0,0,1024,512);g.textAlign='center';g.shadowBlur=0;
  {const pg=g.createLinearGradient(40,0,984,0);pg.addColorStop(0,'#ff2d6f');pg.addColorStop(.5,'#b44cff');pg.addColorStop(1,'#22d3ff');
   g.beginPath();if(g.roundRect)g.roundRect(50,20,924,472,44);else g.rect(50,20,924,472);
   g.fillStyle='rgba(14,6,34,.62)';g.fill();g.lineWidth=3;g.strokeStyle=pg;g.stroke();}
  g.shadowBlur=30;g.shadowColor='#b44cff';
  const gr=g.createLinearGradient(200,0,824,0);gr.addColorStop(0,'#ff2d6f');gr.addColorStop(.5,'#b44cff');gr.addColorStop(1,'#22d3ff');
  const F=function(w,s){return g.font=w+' '+s+'px Segoe UI,Arial,sans-serif';};
  const acc=(total?Math.round(hits/total*100):100)+'% ACCURACY';
  if(state==='play'){
    g.fillStyle=gr;F(800,130);g.fillText(score.toLocaleString(),512,150);
    g.fillStyle='#fff';F(700,48);g.fillText(combo+' COMBO   x'+mult(),512,240);
    F(600,30);g.fillStyle='#ffffffaa';g.fillText('LEVEL '+L.n+'/6  -  '+acc,512,300);
    g.shadowBlur=0;g.fillStyle='#ffffff22';g.fillRect(212,360,600,26);
    const hc1=health>30?'#22d3ff':'#ff2d6f',hg=g.createLinearGradient(212,0,812,0);hg.addColorStop(0,hc1);hg.addColorStop(1,health>30?'#b44cff':'#ff9a2d');
    g.fillStyle=hg;g.shadowBlur=20;g.shadowColor=hc1;g.fillRect(212,360,6*health,26);
  }else{
    g.fillStyle=gr;F(800,120);g.fillText('NEON BLADES',512,160);
    g.fillStyle='#fff';F(600,34);
    if(state==='final'){g.fillStyle='#fff';F(700,34);g.fillText(pname+' - '+runScore.toLocaleString()+' pts',512,225);F(500,26);
      board.slice(0,5).forEach(function(e,i){g.fillStyle=e===mine?'#22d3ff':'#ffffffcc';g.fillText((i+1)+'. '+e.name+'   '+e.score.toLocaleString(),512,275+i*34);});}
    else if(msg){g.fillText(msg+'  -  '+score.toLocaleString()+' pts',512,250);F(500,28);g.fillStyle='#ffffffaa';g.fillText('MAX COMBO '+maxCombo+'   |   '+acc,512,300);}
    g.shadowBlur=0;g.fillStyle='#22d3ffcc';F(700,state==='final'?28:36);g.fillText(state==='final'?'PULL A TRIGGER TO PLAY AGAIN':musicReady?'PULL A TRIGGER TO START LEVEL '+L.n:'LOADING MUSIC...',512,state==='final'?480:400);
  }
  hudTex.needsUpdate=true;
}

function mkSaber(col){
  const g=new THREE.Group(),rot=Math.PI/2;
  const bl=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,1,12),new THREE.MeshBasicMaterial({color:0xffffff}));bl.rotation.x=rot;bl.position.z=-.55;
  const gl=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1.02,12),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));gl.rotation.x=rot;gl.position.z=-.55;
  const hl=new THREE.Mesh(new THREE.CylinderGeometry(.018,.022,.14,12),new THREE.MeshStandardMaterial({color:0x222233,metalness:.8,roughness:.3}));hl.rotation.x=rot;
  const tip=new THREE.Object3D();tip.position.z=-1.05;const base=new THREE.Object3D();base.position.z=-.05;
  g.add(bl,gl,hl,tip,base);g.userData={glow:gl,tip:tip,base:base};return g;
}
const ctl=[0,1].map(function(i){
  const c=R.xr.getController(i),s=mkSaber(COLS[i]);c.add(s);c.userData.saber=s;rig.add(c);
  c.addEventListener('connected',function(e){c.userData.gp=e.data.gamepad;const h=e.data.handedness==='left'?0:1;c.userData.hand=h;s.userData.glow.material.color.setHex(COLS[h]);});
  c.addEventListener('selectstart',trigger);return c;
});
const hOf=function(c){return c.userData.hand!==undefined?c.userData.hand:ctl.indexOf(c);};
const hv=[0,1].map(function(){return {tip:new THREE.Vector3(),prev:new THREE.Vector3(),base:new THREE.Vector3(),vel:new THREE.Vector3(),init:false};});
function buzz(h,s,d){
  s = s || .6; d = d || 40;
  const c=ctl.find(function(x){return hOf(x)===h;}),gp=c&&c.userData.gp;if(!gp)return;
  try{if(gp.hapticActuators&&gp.hapticActuators[0])gp.hapticActuators[0].pulse(s,d);else if(gp.vibrationActuator)gp.vibrationActuator.playEffect('dual-rumble',{duration:d,strongMagnitude:s,weakMagnitude:s});}catch(e){}
}
let mx=0,my=1.4;
addEventListener('pointermove',function(e){mx=(e.clientX/innerWidth-.5)*2.4;my=1.9-(e.clientY/innerHeight)*1.6;});
addEventListener('pointerdown',function(){if(!R.xr.isPresenting&&ui.style.display==='none'&&$('sb').style.display!=='flex')trigger();});

let chart=[];
function buildChart(){
  let seed=11+L.n*97,vc=0,t=3;
  const r=function(){return (seed=seed*16807%2147483647)/2147483647;};
  chart=[];
  const mk=function(h,p){return {t:t,c:h,lane:h?3-p.l:p.l,row:p.row,dir:p.d>=2?(h?3:2):p.d};};
  const pat=function(){return {l:r()*2|0,row:r()*3|0,d:r()<.2?2:(vc++%2)};};
  const seq=['s','s','s','s','same','s','s','opp']; 
  
  // Calculate total track duration or default duration to generate chart for the full song length
  const duration = (trackBuf && trackBuf.duration) ? trackBuf.duration - 5 : 90;
  
  while(t < duration){
    let h=0,p;
    seq.forEach(function(e,i){
      if(t >= duration) return;
      if(e==='s'){
        if(h===0) p=pat();
        chart.push(mk(h,p));
        h^=1;
      }
      else{
        const q=pat();
        const pairDir = (r() < 0.5 ? 0 : 1);
        chart.push(mk(0,Object.assign({}, q, {d: pairDir})), mk(1,Object.assign({}, q, {d: pairDir})));
      }
      if(i<seq.length-1)t+=L.gap;
    });
    t+=2; 
  }
}

function trigger(){
  if(!ctx||performance.now()<lock||state==='play')return;
  if(state==='final'){if(R.xr.isPresenting)newRun();return;}
  if(musicReady)startGame();
}
function setLevel(i){lvl=i;L=LEVELS[i];prepLevel();}
function newRun(){$('sb').style.display='none';runScore=0;results=[];score=0;msg='';state='menu';lock=performance.now()+400;setLevel(selectedStartLvl);}
function startGame(){
  notes.forEach(function(n){S.remove(n.m);});notes=[];buildChart();
  score=combo=maxCombo=hits=total=ci=0;health=50;msg='';state='play';musicOn=false;
  musicBus.gain.cancelScheduledValues(ctx.currentTime);musicBus.gain.setTargetAtTime(.7,ctx.currentTime,.05);
  songT0=ctx.currentTime+.2;playTrack(songT0);sx.start();drawHUD();
}
function finish(){
  state='final';
  let sc=[];try{sc=JSON.parse(localStorage.getItem('nb_scores')||'[]')}catch(e){}
  mine={name:pname,score:runScore,levels:results.slice(),ts:Date.now()};sc.push(mine);sc.sort(function(a,b){return b.score-a.score;});sc=sc.slice(0,20);
  try{localStorage.setItem('nb_scores',JSON.stringify(sc))}catch(e){}
  board=sc;showBoard();
}
function endGame(win){
  state='over';musicOn=false;lock=performance.now()+2000;stopTrack();
  const last=win&&lvl===LEVELS.length-1;
  if(win){sx.win();runScore+=score;results.push(score);msg='LEVEL '+L.n+' COMPLETE';if(!last)setLevel(lvl+1);}
  else{sx.fail();msg='FAILED - TRY AGAIN';}
  if(last)finish();
  setTimeout(function(){if(state!=='over'&&state!=='final')return;clockT=ctx.currentTime+.1;step=0;musicOn=true;drawHUD();},win?3500:1800);
  drawHUD();
}
function hurt(a){health=Math.max(0,health-a);combo=0;if(health<=0)endGame(false);}
function hit(n,h,sp){
  hits++;total++;combo++;maxCombo=Math.max(maxCombo,combo);health=Math.min(100,health+2);
  score+=Math.round((70+Math.min(30,sp*6))*mult());
  sx.hit(combo);if(combo%10===0){sx.fan();flash=1;}buzz(h,.7,45);
}
const _a=new THREE.Vector3(),_b=new THREE.Vector3(),_c=new THREE.Vector3();
function segDist(a,b,p){_a.subVectors(b,a);const t=Math.max(0,Math.min(1,_b.subVectors(p,a).dot(_a)/_a.lengthSq()));return _c.copy(a).addScaledVector(_a,t).distanceTo(p);}

let last=0,hudT=0;
R.setAnimationLoop(function(time){
  const dt=Math.min(.05,(time-last)/1000||.016);last=time;
  if(!R.xr.isPresenting){ctl[0].position.set(-mx,my,-.3);ctl[1].position.set(mx,my,-.3);C.position.x=Math.sin(time/2500)*.08;}
  let beat=0,T=0;
  if(ctx){sched();T=ctx.currentTime-songT0;beat=(state==='play'?T:ctx.currentTime-clockT)/SPB;}
  const pulse=Math.max(0,1-(beat%1)*2.2);flash=Math.max(0,flash-dt*2);

  const hue=(beat*.01+.75)%1;
  pillMat.color.setHSL(hue,1,.2+.3*pulse+.3*flash);ringMat.color.setHSL((hue+.45)%1,1,.25+.25*pulse+.3*flash);
  pills.forEach(function(m,k){const u=m.userData,z=-(((u.i*8+beat*UPB)%80+80)%80);m.position.set(u.sd*5.5,4.5,z);pillM[k].position.set(u.sd*5.5,-4.5,z);pillM[k].material.color.copy(pillMat.color);});
  rings.forEach(function(m){m.position.set(0,0,-(((m.userData.i*10+beat*UPB)%80+80)%80));m.scale.setScalar(1+.04*pulse);});
  gt.offset.y=beat*UPB/2;sun.scale.setScalar(1+.03*pulse);
  beams.forEach(function(b){const u=b.userData,mm=b.children[0].material;b.rotation.z=u.sd*(.25+.35*Math.sin(beat*.5+u.j*2));mm.color.copy(ringMat.color);mm.opacity=.07+.08*pulse+.08*flash;});

  for(let i=0;i<2;i++){
    const s=ctl[i].userData.saber,u=s.userData,h=hOf(ctl[i]),v=hv[h];
    u.tip.getWorldPosition(v.tip);u.base.getWorldPosition(v.base);
    if(!v.init){v.prev.copy(v.tip);v.init=true;}
    v.vel.subVectors(v.tip,v.prev).divideScalar(dt);v.prev.copy(v.tip);
  }
  updTrail(0);updTrail(1);
  if(state==='play'){
    while(ci<chart.length&&(HITZ-(chart[ci].t-T)*L.speed)>=SPAWNZ){spawn(chart[ci++]);}
    for(let i=notes.length-1;i>=0;i--){
      const n=notes[i];if(!n)continue;
      n.m.position.z=HITZ-(n.t-T)*L.speed;
      const progress = Math.max(0, Math.min(1, (n.m.position.z - SPAWNZ) / (HITZ - SPAWNZ)));
      const currentScale = 0.2 + progress * 0.8;
      n.m.scale.setScalar(currentScale);
      if(n.bomb)n.m.rotation.y+=dt*2;
      const z=n.m.position.z;
      if(z>.45){if(!n.bomb){total++;sx.miss();hurt(5);}rm(n);continue;}
      if(z<-1.9)continue;
      for(let h=0;h<2;h++){
        const v=hv[h];
        if(segDist(v.base,v.tip,n.m.position) > CONFIG.hitThreshold) continue;
        const sp=v.vel.length();
        if(n.bomb){if(sp>.6){sx.bomb();buzz(h,1,120);burst(n.m.position,0xff4400,30);rm(n);hurt(10);flash=1;break;}continue;}
        if(sp<1.3)continue;
        let ok=n.c===h;
        if(ok&&n.dir<4){const d=DIRS[n.dir];ok=(v.vel.x*d[0]+v.vel.y*d[1])>.2*sp;}
        burst(n.m.position,COLS[n.c],ok?26:8);
        if(ok)hit(n,h,sp);else{total++;sx.wrong();buzz(h,.3,80);hurt(3);}
        rm(n);break;
      }
    }
    if(ci>=chart.length&&notes.length===0&&state==='play')endGame(true);
  }
  parts.forEach(function(q){if(!q.m.visible)return;q.l-=dt;if(q.l<=0){q.m.visible=false;return;}q.v.y-=6*dt;q.m.position.addScaledVector(q.v,dt);q.m.scale.setScalar(.05+q.l*.16);});
  waves.forEach(function(w){if(!w.visible)return;w.userData.l-=dt;const k=w.userData.l/.35;if(k<=0){w.visible=false;return;}w.scale.setScalar(1+(1-k)*7);w.material.opacity=k;});
  hudT+=dt;if(hudT>.1){hudT=0;drawHUD();}
  R.render(S,C);
});
drawHUD();

function enterMenu(){pname=($('pn').value.trim()||'PLAYER').slice(0,16);initAudio();ctx.resume();clockT=ctx.currentTime+.1;step=0;musicOn=true;ui.style.display='none';newRun();}
const esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

document.querySelectorAll('.level-btn').forEach(function(btn){
  btn.onclick = function(){
    document.querySelectorAll('.level-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    selectedStartLvl = parseInt(btn.getAttribute('data-lvl'), 10);
  };
});

function showBoard(){
  if(R.xr.isPresenting)return;
  $('sbme').innerHTML='<b>'+esc(pname)+'</b> &mdash; '+runScore.toLocaleString()+' pts<br><small>'+results.map(function(v,i){return 'L'+(i+1)+': '+v.toLocaleString();}).join(' &middot; ')+'</small>';
  $('sbt').innerHTML='<tr><th>#</th><th>PLAYER</th><th>SCORE</th></tr>'+board.slice(0,10).map(function(e,i){return '<tr'+(e===mine?' class="me"':'')+'><td>'+(i+1)+'</td><td>'+esc(e.name)+'</td><td>'+e.score.toLocaleString()+'</td></tr>';}).join('');
  $('sb').style.display='flex';
}
$('again').onclick=newRun;
$('pv').onclick=enterMenu;
const vrB=$('vr');
if(navigator.xr){navigator.xr.isSessionSupported('immersive-vr').then(function(ok){if(!ok){vrB.disabled=true;vrB.textContent='VR NOT SUPPORTED HERE';}}).catch(function(){});}
else{vrB.disabled=true;vrB.textContent='WEBXR NOT AVAILABLE';}
vrB.onclick=async function(){
  enterMenu();
  try{
    const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
    R.xr.setSession(s);s.addEventListener('end',function(){ui.style.display='flex';musicOn=false;state='menu';stopTrack(true);$('sb').style.display='none';});
  }catch(e){ui.style.display='flex';alert('Could not start VR: '+e.message);}
};
</script>
